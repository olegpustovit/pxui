[package]
autotests = false
name = "pxui_gallery"
version.workspace = true
edition.workspace = true
license.workspace = true

# The kit gallery: every PXUI widget in a window app on the platform's host and GPU backend. The
# page functions and the GPU half are the library, so the goldens render the same pages headless.
[lib]
name = "pxui_gallery"
path = "src/lib.rs"
test = false

[[bin]]
name = "pxui_gallery"
path = "src/main.rs"
test = false

# `static` (the default) links the engine in; `--no-default-features` links the built libpxui, so the same goldens
# run against the cdylib.
[features]
default = ["static"]
static = ["pxui/static"]

[dependencies]
input = { path = "../../crates/open/input" }
mem_sys = { path = "../../crates/open/mem_sys" }
ogpu_core = { path = "../../crates/open/ogpu_core" }
pxui = { path = "../../crates/public/pxui", default-features = false }
pxui_types = { path = "../../crates/public/pxui_types" }

[target.'cfg(target_os = "macos")'.dependencies]
ogpu_metal = { path = "../../crates/open/ogpu_metal" }
pxui_sdl = { path = "../../crates/open/pxui_sdl" }

[target.'cfg(windows)'.dependencies]
ogpu_vulkan = { path = "../../crates/open/ogpu_vulkan" }
pxui_sdl = { path = "../../crates/open/pxui_sdl" }

[target.'cfg(target_os = "linux")'.dependencies]
ogpu_vulkan = { path = "../../crates/open/ogpu_vulkan" }
pxui_wayland = { path = "../../crates/open/pxui_wayland" }

# Headless: the pages rendered offscreen into goldens; the idle case runs the app hidden.
[[test]]
name = "gpu_gallery"
path = "tests/gpu_gallery.rs"
harness = false

[lints]
workspace = true
