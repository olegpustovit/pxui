[package]
name = "pxui_host"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
static = ["pxui/static"]

[dependencies]
mem_sys = { path = "../../open/mem_sys" }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
input = { path = "../../open/input" }
pxui = { path = "../../public/pxui" }
pxui_sdl = { path = "../../open/pxui_sdl" }
ogpu_core = { path = "../../open/ogpu_core" }
ogpu_metal = { path = "../../open/ogpu_metal" }
metal_sys = { path = "../../open/metal_sys" }

[lints]
workspace = true

[[test]]
name = "window_pxui_host"
path = "tests/window_pxui_host.rs"
harness = false
