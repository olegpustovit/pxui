[alias]
t = "run -q -p rays-t --"

# Windows-gnu: a 256 MB main-thread stack, as in Rays.
# designed limit (specification/pxui.md): Rays also links with rustc's bundled lld there (a -B path pinned to one user's toolchain); add it per machine in ~/.cargo/config.toml.
[target.x86_64-pc-windows-gnu]
rustflags = ["-Clink-arg=-Wl,--stack,268435456"]

# PXUI-owned executables get a 256 MB main-thread stack: harness = false runs on the main thread.
# Consumers may share this linker and set PXUI_CONSUMER_DEFAULT_STACK=1 for their platform default stack.
# A linker wrapper, not a rustflag: the flag must not reach proc-macro dylibs (pxui_text's cosmic-text).
[target.aarch64-apple-darwin]
linker = "tools/cc-stack.sh"

# The dynamic libpxui: executables in target/<profile>/deps find libpxui.so.1 in target/<profile> (macOS: tools/cc-stack.sh).
[target.x86_64-unknown-linux-gnu]
rustflags = ["-Clink-arg=-Wl,-rpath,$ORIGIN/.."]
[target.aarch64-unknown-linux-gnu]
rustflags = ["-Clink-arg=-Wl,-rpath,$ORIGIN/.."]
